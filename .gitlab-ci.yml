stages:
  - prepare
  - build

variables:
  CONTAINER_IMAGE: registry.gitlab.e.foundation:5000/$CI_PROJECT_PATH
  GIT_SUBMODULE_STRATEGY: recursive

build-docker:
  image: docker:19-git
  stage: prepare
  tags:
    - generic_privileged
  variables:
    DOCKER_DRIVER: overlay2
  services:
    - docker:19-dind
  script:
    - echo "$CI_JOB_TOKEN" | docker login registry.gitlab.e.foundation:5000 -u gitlab-ci-token --password-stdin
    - docker pull $CONTAINER_IMAGE:latest || true
    - docker build --cache-from $CONTAINER_IMAGE:latest --tag $CONTAINER_IMAGE:latest ${CI_PROJECT_DIR}
    - docker push $CONTAINER_IMAGE:latest

.build-bromite:
  image: $CONTAINER_IMAGE
  tags:
    - build-browser

build-bromite-arm64:
  stage: build
  extends: .build-bromite
  script:
    - $CI_PROJECT_DIR/build.sh -c -s -a arm64
  artifacts:
    name: "$CI_JOB_NAME"
    paths:
      - apks/arm*

build-bromite-x64:
  stage: build
  extends: .build-bromite
  script:
    - $CI_PROJECT_DIR/build.sh -c -s -a x64
  artifacts:
    name: "$CI_JOB_NAME"
    paths:
      - apks/x86*
