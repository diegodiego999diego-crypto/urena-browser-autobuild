workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG

stages:
  - build

.build-cromite:
  image: registry.gitlab.e.foundation/e/os/docker-android-apps-cicd:chromium-latest
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  artifacts:
    name: "$CI_JOB_NAME"
    paths:
      - apks/*
      - bin/*
    expire_in: 1 week

build-cromite-arm:
  stage: build
  extends: .build-cromite
  tags:
    - build-browser-arm
  script:
    - $CI_PROJECT_DIR/build.sh -h -s -a arm

build-cromite-arm64:
  stage: build
  extends: .build-cromite
  tags:
    - build-browser-arm
  script:
    - $CI_PROJECT_DIR/build.sh -h -s -a arm64

build-cromite-x86:
  stage: build
  extends: .build-cromite
  tags:
    - build-browser-x86
  script:
    - $CI_PROJECT_DIR/build.sh -h -s -a x86

build-cromite-x64:
  stage: build
  extends: .build-cromite
  tags:
    - build-browser-x86
  script:
    - $CI_PROJECT_DIR/build.sh -h -s -a x64
