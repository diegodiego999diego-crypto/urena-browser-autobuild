workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG
stages:
  - build
  - filters

.build-cromite:
  image: registry.gitlab.e.foundation/e/os/docker-android-apps-cicd:chromium-latest
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  tags:
    - build-browser
  artifacts:
    name: "$CI_JOB_NAME"
    paths:
      - apks/*
      - bin/*
    expire_in: 1 week

build-cromite-arm:
  stage: build
  extends: .build-cromite
  script:
    - $CI_PROJECT_DIR/build.sh -c -s -a arm

build-cromite-arm64:
  stage: build
  extends: .build-cromite
  script:
    - $CI_PROJECT_DIR/build.sh -c -s -a arm64

build-cromite-x86:
  stage: build
  extends: .build-cromite
  script:
    - $CI_PROJECT_DIR/build.sh -c -s -a x86

build-cromite-x64:
  stage: build
  extends: .build-cromite
  script:
    - $CI_PROJECT_DIR/build.sh -c -s -a x64

.build-filters:
  image: registry.gitlab.e.foundation/e/os/docker-android-apps-cicd:slim-latest
  stage: filters
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == "master"
    - when: manual

update-filters:
  stage: filters
  extends: .build-filters
  needs: []
  script:
    - $CI_PROJECT_DIR/generate_filters.sh
  artifacts:
    paths:
      - filters.dat

deploy_rsync:
  stage: filters
  extends: .build-filters
  needs:
    - job: update-filters
  before_script:
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY_ED" > $HOME/.ssh/id_ed25519
    - echo "$SSH_PUBKEY_ED" > $HOME/.ssh/id_ed25519.pub
    - echo "$SSH_KNOWN_HOSTS" > $HOME/.ssh/known_hosts
    - chmod 600 ~/.ssh/id_ed25519
    - chmod 644 ~/.ssh/known_hosts ~/.ssh/id_ed25519.pub
  script:
    - rsync -avz --chown=$REMOTE_USER:www-data --chmod=F644 filters.dat $REMOTE_USER@$IMAGES_HOSTNAME:$BROWSER_PATH
