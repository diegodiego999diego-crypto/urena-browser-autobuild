stages:
  - prepare
  - build-arm
  - build-arm64
  - build-x86
  - build-x64

variables:
  CONTAINER_IMAGE: registry.gitlab.e.foundation:5000/$CI_PROJECT_PATH
  GIT_SUBMODULE_STRATEGY: recursive

build-docker:
  image: docker:19-git
  stage: prepare
  tags:
    - generic_privileged
  variables:
    DOCKER_DRIVER: overlay2
  services:
    - docker:19-dind
  script:
    - echo "$CI_JOB_TOKEN" | docker login registry.gitlab.e.foundation:5000 -u gitlab-ci-token --password-stdin
    - docker pull $CONTAINER_IMAGE:latest || true
    - docker build --cache-from $CONTAINER_IMAGE:latest --tag $CONTAINER_IMAGE:latest ${CI_PROJECT_DIR}
    - docker push $CONTAINER_IMAGE:latest

.build-bromite:
  image: $CONTAINER_IMAGE
  tags:
    - build-browser
  artifacts:
    name: "$CI_JOB_NAME"
    paths:
      - apks/*
  after_script:
    - $CI_PROJECT_DIR/build.sh -c

build-bromite-arm:
  stage: build-arm
  extends: .build-bromite
  script:
    - $CI_PROJECT_DIR/build.sh -a arm

build-bromite-arm64:
  stage: build-arm64
  extends: .build-bromite
  script:
    - $CI_PROJECT_DIR/build.sh -a arm64

build-bromite-x86:
  stage: build-x86
  extends: .build-bromite
  script:
    - $CI_PROJECT_DIR/build.sh -a x86

build-bromite-x64:
  stage: build-x64
  extends: .build-bromite
  script:
    - $CI_PROJECT_DIR/build.sh -a x64
